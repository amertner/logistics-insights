insufficient-storage-none-action=[font=default-semibold]Netværket har ingen lagerkister.[/font]\nUden lager har robotterne ingen steder at lægge ting, der kasseres eller fjernes fra leverandørkister. Overvej at tilføje nogle, eller ignorér dette i netværksindstillingerne, hvis det er med vilje.
