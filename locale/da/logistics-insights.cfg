[mod-setting-description]
li-show-undersupply=Vis varer, hvor efterspørgslen er større end forsyningen, med den største underforsyning først.
li-show-suggestions=Vis forslag baseret på aktivitet og status, såsom forbedring af lagring, opladning infrastruktur, osv.
li-show-history=Vis de mest almindelige genstande der bliver leveret, dem som robotterne samlet flyver længst med, og dem med de længste enkelte ture.\n\nAt vise disse rækker er også det, der får LI til at registrere historikken: et netværks leveringer følges kun, mens mindst én spiller i det har dem vist. Forslaget om lange ture laves ud fra denne historik, så det kræver dem også.
li-max-items=Hver række viser op til dette antal: varer under levering, summer, afstande, underforsynede varer og forslag. Det, der falder uden for de første, vises ikke.
li-ui-update-interval=Vinduet gentegnes hvert dette antal tiks; [font=default-semibold]60[/font] er én gang i sekundet. Lavere for tal, der følger scanningen tættere, højere for at spare lidt CPU med flere spillere eller store vinduer.
li-highlight-duration=Antal sekunder fremhævelser bliver på kortet. Ture vist fra rækken Længste tur bliver tre gange så længe, da de tager længere tid at følge.\n[font=default-semibold]0[/font] betyder [font=default-semibold]uendelig[/font].
li-initial-zoom=Zoomniveau når du bruger __ALT_CONTROL__1__mine__ for at vise en enkelt vare. En større værdi betyder at du zoomer længere ind.\nNormalt mellem [font=default-semibold]0.3[/font] og [font=default-semibold]3[/font].
li-show-all-networks=Behold historik, forslag og underforsyning for alle netværk, LI har set, og vis dem alle i Netværksvinduet.\n\nNår slået fra, beholdes kun netværk med en spiller i: data for de øvrige slettes, når den sidste spiller forlader dem, og de forsvinder fra Netværksvinduet.
li-gather-quality-data-global=Tæl robotter og robothavne efter kvalitet, vist i værktøjstips for rækkerne Aktivitet og Netværk. Koster ét ekstra opslag pr. scannet robot og robothavn; kan med fordel slås fra i et meget stort netværk uden kvalitet.
li-freeze-highlighting-bots=Frys spillet for alle spillere, mens robotter er fremhævet, så de bliver, hvor fremhævelserne er. Når slået fra, flyver robotterne videre og efterlader fremhævelserne inden for et par sekunder.
li-chunk-size-global=Hvor mange robotter, robothavne, anmoderkister eller lagerkister der ses på ad gangen. Et netværk med flere end dette scannes over flere gennemløb, ét afsnit pr. gennemløb: 1.100 robotter med 500 pr. afsnit tager 3 gennemløb.\n\nStørre er bedre: færre gennemløb, så resultaterne kommer før, og alle robotter ses i samme øjeblik. Den eneste omkostning er et større spring i arbejde i det tik, et afsnit behandles, så sæt det kun ned, hvis spillet hakker. [font=default-semibold]400[/font] passer til de fleste maskiner.
li-chunk-processing-interval-ticks=Hvor mange tiks der går mellem ét afsnit og det næste; [font=default-semibold]7[/font] er omkring ni afsnit i sekundet. Mindre betyder, at resultaterne kommer før, og at flere afhentninger ses, så flere turlængder måles i stedet for at anslås. Større spreder arbejdet ud.
li-ignore-player-demands-in-undersupply=Hold spilleres personlige logistikanmodninger ude af den efterspørgsel, underforsyning måles mod. Personlige anmodninger opfyldes ofte ikke med vilje eller stilles langt fra enhver forsyning og ville ellers vises som mangler.

