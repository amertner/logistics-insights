[mod-setting-description]
li-show-undersupply=Show items where demand is larger than supply, with the biggest undersupply first.
li-show-suggestions=Show suggestions based on activity and status, such as improving storage, charging infrastructure, etc.
li-show-history=Show the most common items delivered, the ones bots carry the furthest in total, and the ones with the longest single trips.\n\nShowing these rows is also what makes LI record the history: a network's deliveries are only followed while at least one player in it has them shown. The long trip suggestion is made from this history, so it needs them too.
li-show-networks-mini-window=Show or hide the top left mini window that displays the total number of suggestions across all networks and allows you to open the Networks window.
li-show-main-mini-window=Show or hide the top left mini window that displays the total number of idle logistics robots in the current network and allows you to open the Logistics Insights window.
li-max-items=Every row shows up to this many entries: items being delivered, totals, distances, undersupplied items and suggestions. Whatever falls outside the first ones is not shown.
li-ui-update-interval=The window is redrawn every this many ticks; [font=default-semibold]60[/font] is once a second. Lower for numbers that follow the scan more closely, higher to save a little CPU with several players or large windows.
li-highlight-duration=Number of seconds that highlights stay on the map. Trips shown from the Longest trip row stay three times as long, as they take longer to follow.\n[font=default-semibold]0[/font] means [font=default-semibold]infinite[/font].
li-show-trip-estimates=When a robot is first seen already carrying an item, its pickup was never observed, so the trip drawn on the map starts wherever the robot happened to be. A dashed line then shows how much further back the pickup could have been.\n\nUncheck to draw only what was actually observed. This affects your own view only.
li-initial-zoom=The zoom level when using __ALT_CONTROL__1__mine__ to focus on an individual item. A larger value represents zooming further in.\nUsually between [font=default-semibold]0.3[/font] and [font=default-semibold]3[/font].
li-show-all-networks=Keep the history, suggestions and undersupply of every network LI has seen, and list them all in the Networks window.\n\nWhen off, only networks with a player in them are kept: the data for the others is discarded once the last player leaves, and they drop out of the Networks window.
li-gather-quality-data-global=Count robots and roboports by quality, shown in the Activity and Network row tooltips. Costs one extra lookup per robot and roboport scanned; worth turning off in a very large network that uses no quality.
li-calculate-undersupply=Work out which items are requested faster than they are supplied. Turning this off removes the Undersupply row from every player's window and empties that column in the Networks window, and saves scanning every requester chest.
li-freeze-highlighting-bots=Freeze the game for every player while robots are highlighted, so they stay where the highlights are. When off, the robots fly on and leave the highlights behind within a second or two.
li-chunk-size-global=How many robots, roboports, requesters or storage chests are looked at in one go. A network with more than this is scanned over several passes, one chunk per pass: 1,100 robots at 500 a chunk takes 3 passes.\n\nLarger is better: fewer passes, so results arrive sooner and every robot is seen at the same moment. The one cost is a bigger spike of work in the tick a chunk is processed, so lower this only if you see stutter. [font=default-semibold]400[/font] suits most machines.
li-undersupply-rolling-divisor=Only sample [font=default-semibold]1/N[/font] of requesters per undersupply scan; reuse the previous result for the rest. After [font=default-semibold]N[/font] scans every requester has been refreshed once. Higher values reduce CPU cost roughly proportionally, at the cost of slower detection of new shortages (a few seconds at typical scan intervals).\n\n[font=default-semibold]1[/font] disables this optimisation entirely. A requester switched off by circuit is always noticed at once; while switched on it is sampled like any other.
li-analysis-chunk-divisor=Divides the chunk size for undersupply and storage analysis, reducing per-tick CPU spikes at the cost of taking more ticks to complete each analysis pass. Scanning is not affected.\n\n[font=default-semibold]1[/font] processes the full chunk each tick (fastest results, highest spikes). [font=default-semibold]4[/font] processes a quarter per tick (recommended for large bases).
li-chunk-processing-interval-ticks=How many ticks pass between one chunk and the next; [font=default-semibold]7[/font] is about nine chunks a second. Smaller means results arrive sooner and more pickups are seen, so more trip distances are measured rather than estimated. Larger spreads the work out.
li-age-out-suggestions-interval-minutes=Once the condition behind a suggestion has been resolved, the suggestion is kept, greyed out, for this many minutes before it goes away by itself. __CONTROL_KEY_CTRL____CONTROL_STYLE_BEGIN__+__CONTROL_STYLE_END____CONTROL_LEFT_CLICK__ removes it at once.\n\n[font=default-semibold]0[/font] removes a suggestion the moment it stops being current.
li-long-trip-min-distance=How far bots have to carry an item before the trip counts as a "long trip". It also has to be much further than that item's typical trip. One tile is one metre, so [font=default-semibold]200[/font] is a little over three chunks. The suggestion is red from 1 km, or twice this distance if that is more.\n\nRaise this in a large, spread-out base where long deliveries are normal; lower it in a compact base to catch shorter detours.
li-long-trip-suggestions=How much further than usual an item has to be carried before it is flagged for this suggestion, compared to that item's typical (median) trip. [font=default-semibold]Relaxed[/font] is 8 times as far, [font=default-semibold]Normal[/font] 4 times, [font=default-semibold]Sensitive[/font] twice.\n\nThe minimum distance still applies, so a short trip is never flagged however sensitive this is. A trip also stops being flagged once it has not happened for as long as [font=default-semibold]Keep old suggestions[/font], or for three minutes if that is shorter, so the suggestion goes away by itself once the route is fixed.\n\nThe suggestion is made from the delivery history, so it only appears for networks that have been watched with the per-player [font=default-semibold]History[/font] rows shown.\n\n[font=default-semibold]Off[/font] turns the suggestion off altogether; to silence just one route instead, exclude it from the Longest trip row.
li-ignore-mobile-trips=Deliveries to a character or spidertron, and pickups from one, are left out of the Longest trip row and the long trip suggestion. Such a trip goes wherever the player happens to be, so it says nothing about where a closer supply would help, and it cannot be excluded by destination as the destination keeps moving.\n\nThe trips still count in Total items, Distance carried and each item's average and median trip.
li-background-refresh-interval=How often networks nobody is looking at are scanned, and analysed for suggestions and undersupply. Scans are spread across the interval, so with 5 networks and 30 seconds each is scanned about every 30 seconds, one every 6 seconds. The robot count suggestions look for trends over at least four of these intervals.\n\n[font=default-semibold]0[/font] stops background scanning and analysis altogether: the Networks window then only has current figures for networks a player is in.
li-ignore-player-demands-in-undersupply=Leave players' personal logistic requests out of the demand that undersupply is measured against. Personal requests are often left unmet on purpose, or made far from any supply, and would otherwise show up as shortages.

